<style>
:root{
  --bg:#f3f6fb; --surface:#fff; --surface-2:#edf1f8; --line:#dfe5ef; --text:#0f1a2e; --muted:#56637a; --faint:#8a95a8;
  --accent:#1a56db; --accent-ink:#fff; --accent-soft:#e3ecff;
  --verde:#15803d; --verde-s:#dcfce7; --amarillo:#a16207; --amarillo-s:#fef3c7; --rojo:#b91c1c; --rojo-s:#fee2e2;
  --azul:#1d4ed8; --azul-s:#dbeafe; --gris:#5f6b73; --gris-s:#eceff1;
  --d-verde:#22c55e; --d-amarillo:#f59e0b; --d-rojo:#ef4444; --d-azul:#3b82f6; --d-gris:#9ca3af;
  --r:14px; --shadow:0 10px 40px rgba(0,0,0,.18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1324; --surface:#111c33; --surface-2:#18253f; --line:#24324f; --text:#e8eefb; --muted:#9aa8c2; --faint:#6b7894;
    --accent:#5b9bff; --accent-ink:#04122e; --accent-soft:#13264a;
    --verde:#4ade80; --verde-s:#12301f; --amarillo:#fbbf24; --amarillo-s:#3a2c0b; --rojo:#f87171; --rojo-s:#3b1515;
    --azul:#60a5fa; --azul-s:#142a4a; --gris:#a3acb3; --gris-s:#22292b; --shadow:0 10px 40px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1324; --surface:#111c33; --surface-2:#18253f; --line:#24324f; --text:#e8eefb; --muted:#9aa8c2; --faint:#6b7894;
  --accent:#5b9bff; --accent-ink:#04122e; --accent-soft:#13264a;
  --verde:#4ade80; --verde-s:#12301f; --amarillo:#fbbf24; --amarillo-s:#3a2c0b; --rojo:#f87171; --rojo-s:#3b1515;
  --azul:#60a5fa; --azul-s:#142a4a; --gris:#a3acb3; --gris-s:#22292b; --shadow:0 10px 40px rgba(0,0,0,.5);
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.01em}
.ic{width:18px;height:18px;flex:none}
.muted{color:var(--muted)}
.m{transition:filter .15s}
body.privado .m{filter:blur(7px);user-select:none}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{background:var(--rojo);border-color:var(--rojo);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:32px;padding:0 11px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.6;cursor:progress}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:0;background:transparent;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 0;font-weight:600}

/* Estructura */
.demo-bar{background:var(--amarillo-s);color:var(--amarillo);font-size:13px;font-weight:600;text-align:center;padding:7px 16px}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;border-right:1px solid var(--line);background:var(--surface);padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 10px 18px}
.brand b{display:block;font-size:15px}
.brand small{display:block;color:var(--muted);font-size:12px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.side .grow{flex:1}
.userbox{border-top:1px solid var(--line);padding:12px 8px 0;display:flex;align-items:center;gap:6px}
.userbox .who{flex:1;min-width:0;font-size:12.5px}
.userbox .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userbox .who small{color:var(--muted)}
.main{min-width:0;padding:22px 28px 48px;max-width:1240px;width:100%}
.mtop{display:none}
.bnav{display:none}
.fab{display:none}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 18px;flex-wrap:wrap}
.top h1{font-size:24px;font-weight:750;display:flex;align-items:center;gap:10px}
.top .sub{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.top-act{display:flex;gap:8px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13.5px;font-weight:600;margin-bottom:6px}
.back:hover{color:var(--text)}
.h2{font-size:16px;font-weight:700;margin:22px 0 10px}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 8px}
.sec-h h3{font-size:15px;font-weight:700}
.sec-h a{font-size:13px;color:var(--accent);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi small{color:var(--muted);font-size:12.5px;display:block;font-weight:500}
.kpi b{font-size:clamp(17px,1.6vw,22px);font-weight:750;letter-spacing:-.015em;display:block;margin-top:3px;overflow-wrap:anywhere}
.kpi em{font-style:normal;font-size:12px;color:var(--faint)}
.kpi.hl{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hl small,.kpi.hl em{color:inherit;opacity:.82}
.sem{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.semt{border-radius:var(--r);padding:14px 16px 14px 20px;border:1px solid var(--line);background:var(--surface);position:relative;overflow:hidden;cursor:pointer;text-align:left;display:block;width:100%}
.semt::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.semt:hover{background:var(--surface-2)}
.semt .t{display:flex;align-items:center;gap:8px;font-weight:650;font-size:13.5px}
.semt .n{font-size:30px;font-weight:800;line-height:1.1;margin-top:6px}
.semt .s{color:var(--muted);font-size:12.5px}
.verde{--c:var(--d-verde)} .amarillo{--c:var(--d-amarillo)} .rojo{--c:var(--d-rojo)} .azul{--c:var(--d-azul)} .gris{--c:var(--d-gris)}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}

/* Filas */
.list .row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.list .sec-h + .row{border-top:0}
a.row:hover{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right;flex:none}
.amt{font-weight:700;white-space:nowrap}
.amt.pos{color:var(--verde)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 20%,transparent)}
.mv{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;font-weight:800}
.mv.in{background:var(--verde-s);color:var(--verde)}
.mv.out{background:var(--surface-2);color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.day-h{padding:10px 16px 6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--surface-2);border-top:1px solid var(--line)}
.day-h:first-child{border-top:0;border-radius:var(--r) var(--r) 0 0}
.bar{height:5px;border-radius:9px;background:var(--surface-2);margin-top:7px;overflow:hidden;max-width:260px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.bar.big{height:9px;max-width:none;margin:10px 0 4px}
.t-verde{color:var(--verde)} .t-amarillo{color:var(--amarillo)} .t-rojo{color:var(--rojo)} .t-azul{color:var(--azul)} .t-gris{color:var(--gris)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.verde{background:var(--verde-s);color:var(--verde)} .pill.amarillo{background:var(--amarillo-s);color:var(--amarillo)}
.pill.rojo{background:var(--rojo-s);color:var(--rojo)} .pill.azul{background:var(--azul-s);color:var(--azul)}
.pill.gris,.pill.pendiente{background:var(--gris-s);color:var(--gris)}
.pill.pagada{background:var(--verde-s);color:var(--verde)} .pill.vencida{background:var(--rojo-s);color:var(--rojo)}
.pill.hoy,.pill.parcial{background:var(--amarillo-s);color:var(--amarillo)}

/* Barra de herramientas */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--text)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .dot{width:8px;height:8px;box-shadow:none}
.chip i{font-style:normal;opacity:.7}
.inp{height:38px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

/* Detalle */
.dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:12px 0 0;font-size:14px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:550;min-width:0;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px 18px;margin-top:14px}
.stats small{display:block;color:var(--muted);font-size:12px}
.stats b{display:block;font-size:16px;font-weight:700;margin-top:2px}
.saldo-big{font-size:32px;font-weight:800;letter-spacing:-.02em}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:650;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.is-hoy td{background:color-mix(in srgb,var(--d-amarillo) 8%,transparent)}
.actions-inline{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(5,12,10,.5);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s}
.dlg{background:var(--surface);border-radius:18px;width:min(560px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .18s ease-out}
.dlg header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.dlg header h3{font-size:18px;font-weight:750}
.dlg-body{padding:8px 18px 4px;overflow-y:auto}
.dlg footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px 18px;border-top:1px solid var(--line);margin-top:10px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.fld>span{font-size:12.5px;font-weight:650;color:var(--muted)}
.fld input,.fld select,.fld textarea,.login input{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none}
.fld textarea{height:auto;padding:10px 12px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.login input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:-2px 0 12px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.preview{background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:4px 0 6px}
.preview .stats{margin-top:0}
.preview .warn{margin-top:10px;font-size:12.5px;color:var(--rojo);font-weight:600}
.preview .note{margin-top:10px;font-size:12.5px;color:var(--muted)}
.mini{background:var(--surface-2);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.mini b{display:block}
.mini span{font-size:13px;color:var(--muted)}
.fills{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.quick{display:grid;gap:8px}
.quick button{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;text-align:left;font-weight:650}
.quick button:hover{border-color:var(--accent)}
.quick small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}

/* Toasts */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);animation:up .2s ease-out;transition:opacity .3s}
.toast.err{background:var(--rojo);color:#fff}
.toast.out{opacity:0}

/* Login */
.login{min-height:100dvh;display:grid;place-items:center;padding:16px;background:radial-gradient(1200px 600px at 10% -10%,var(--accent-soft),transparent 60%),var(--bg)}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.login-card .brand{padding:0 0 6px}
.login-card label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:650;color:var(--muted)}
.note{background:var(--amarillo-s);color:var(--amarillo);padding:10px 12px;border-radius:10px;font-size:13px;font-weight:550}
.alert{background:var(--rojo-s);color:var(--rojo);padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600}
.okmsg{background:var(--verde-s);color:var(--verde);padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot .7s linear infinite}

@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes rot{to{transform:rotate(360deg)}}

@media (max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:899px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding:8px 16px 104px}
  .mtop{display:flex;align-items:center;gap:8px;padding:10px 12px 4px 16px;position:sticky;top:0;z-index:20;background:var(--bg)}
  .mtop .brand{padding:0;flex:1}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;background:none;border:0;cursor:pointer}
  .bnav a.on{color:var(--accent)}
  .bnav .plus{width:46px;height:46px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:-14px auto 0;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
  .top h1{font-size:21px}
  .top-act .btn .lbl{display:none}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .sem{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi{padding:12px 13px}
  .kpi b{font-size:17px}
  .sem{gap:8px}
  .semt{padding:12px 10px 12px 16px}
  .semt .n{font-size:24px}
  .semt .s{display:none}
  .list .row{padding:12px 14px;gap:10px}
  .row .hide-sm{display:none}
  .ov{place-items:end center;padding:0}
  .dlg{border-radius:20px 20px 0 0;width:100%;max-height:92dvh}
  .dlg footer{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  #toasts{bottom:90px}
}
@media (max-width:380px){.g2{grid-template-columns:1fr}}

/* ---- Versión simple ---- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:12px;margin-bottom:14px}
.caja{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:18px 18px 16px;display:flex;flex-direction:column;gap:4px}
.caja small{opacity:.85;font-size:13px;font-weight:600}
.caja .big{font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.caja .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.caja .btn{background:rgba(255,255,255,.16);border-color:transparent;color:inherit;height:34px;font-size:13px}
.caja .btn:hover{background:rgba(255,255,255,.26)}
.hero .kpis{margin:0;grid-template-columns:repeat(2,minmax(0,1fr))}
.welcome{padding:22px}
.welcome h3{font-size:18px;margin-bottom:6px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.step{border:1px dashed var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px}
.step p{margin:0;font-size:13.5px;color:var(--muted)}
.loan{padding:16px;margin-bottom:12px}
.loan-top{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.loan-top b{font-size:16px}
.loan-top small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.qs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.q{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--line);color:var(--muted);background:var(--surface)}
.q.pagada{background:var(--d-verde);border-color:var(--d-verde);color:#fff}
.q.vencida{border-color:var(--d-rojo);color:var(--rojo);background:var(--rojo-s)}
.q.hoy{border-color:var(--d-amarillo);color:var(--amarillo);background:var(--amarillo-s)}
.q.parcial{border-color:var(--d-verde);color:var(--verde)}
.loan .stats{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.wa{color:var(--verde)}
.big-num{font-size:20px;font-weight:800}
.calc{background:var(--accent-soft);border-radius:12px;padding:14px;margin:2px 0 8px}
.calc .line{font-size:20px;font-weight:800;color:var(--accent);letter-spacing:-.01em}
.calc .sub{font-size:13.5px;color:var(--text);margin-top:4px}
.calc .sub b{font-weight:700}
.calc .alerta{margin-top:8px;font-size:12.5px;color:var(--amarillo);font-weight:600}
.g3{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,.8fr) minmax(0,1.4fr);gap:0 10px}
.loan-top b .dot{display:inline-block;vertical-align:middle;margin:0 6px 2px 2px}
@media (max-width:899px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:minmax(0,1fr)}
  .bnav{grid-template-columns:repeat(5,1fr)}
}
@media (max-width:420px){.g3{gap:0 8px}}

/* ============================ Utilidades ============================ */

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const addMonths = (d, n) => { const day = d.getDate(); const x = new Date(d.getFullYear(), d.getMonth() + n, 1); const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(day, last)); return x; };
const hoyStr = () => toStr(new Date());

const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

/* ============================ Estado ============================ */
const S = { clientes: [], prestamos: [], pagos: [], caja: [], aj: { ...AJ_DEF }, user: null, f: { sem: 'todos', q: '', periodo: 'mes' } };
let E = new Map(), PAGOS_BY = new Map(), CLI = new Map(), PBC = new Map(), PREST = new Map();
const SEM_ORD = { rojo: 4, amarillo: 3, verde: 2, azul: 1, gris: 0 };
const SEM_LBL = { verde: 'Al día', amarillo: 'Atrasado', rojo: 'En mora', azul: 'Pagado', gris: 'Sin préstamos' };

/* ======================= Cuentas del préstamo =======================
   Ejemplo: $300.000 al 10% mensual por 2 meses en 4 cuotas
   Interés = 300.000 × 10% × 2 = 60.000 → Total 360.000 → 4 cuotas de 90.000 */
function calcular(p) {
  const capital = +p.capital || 0, tasa = +p.tasa || 0, meses = Math.max(0.25, +p.meses || 1), n = Math.max(1, parseInt(p.num_cuotas) || 1);
  const interes = Math.round(capital * tasa / 100 * meses);
  const total = capital + interes;
  const cuota = Math.round(total / n);
  const ultima = total - cuota * (n - 1);
  return { capital, tasa, meses, n, interes, total, cuota, ultima };
}
function intervalo(meses, n) {
  const per = meses / n;
  if (per >= 1 && Math.abs(per - Math.round(per)) < 1e-9) return { tipo: 'mes', paso: Math.round(per) };
  return { tipo: 'dia', paso: Math.max(1, Math.floor(per * 30 + 1e-9)) };
}
function frecuenciaTxt(meses, n) {
  const it = intervalo(+meses || 1, Math.max(1, parseInt(n) || 1));
  if (it.tipo === 'mes') return it.paso === 1 ? 'mensual' : `cada ${it.paso} meses`;
  return ({ 1: 'diaria', 7: 'semanal', 15: 'quincenal' })[it.paso] || `cada ${it.paso} días`;
}
function fechasCuotas(p) {
  const c = calcular(p), ini = parse(p.fecha_inicio || hoyStr()), it = intervalo(c.meses, c.n);
  return Array.from({ length: c.n }, (_, k) => toStr(it.tipo === 'mes' ? addMonths(ini, it.paso * (k + 1)) : addDays(ini, it.paso * (k + 1))));
}
function estado(p) {
  const c = calcular(p), fechas = fechasCuotas(p), hoy = hoyStr();
  const pagos = PAGOS_BY.get(p.id) || [];
  const pagado = sum(pagos, x => x.valor);
  let rest = pagado;
  const cuotas = fechas.map((fecha, i) => {
    const valor = i < c.n - 1 ? c.cuota : c.ultima;
    const ab = Math.min(rest, valor); rest = Math.max(0, rest - ab);
    const est = ab >= valor - 0.5 ? 'pagada' : fecha < hoy ? 'vencida' : fecha === hoy ? 'hoy' : ab > 0 ? 'parcial' : 'pendiente';
    return { numero: i + 1, fecha, valor, abonado: ab, est };
  });
  const saldo = Math.max(0, c.total - pagado);
  const proxima = cuotas.find(q => q.est !== 'pagada') || null;
  const dias = proxima && proxima.fecha < hoy ? diffDays(hoy, proxima.fecha) : 0;
  const sem = saldo <= 0.5 ? 'azul' : dias >= S.aj.dias_mora ? 'rojo' : dias > 0 ? 'amarillo' : 'verde';
  const pagadas = cuotas.filter(q => q.est === 'pagada').length;
  return {
    ...c, cuotas, pagado, saldo, proxima, dias, sem, activo: saldo > 0.5, pagadas, faltan: c.n - pagadas,
    debeHoy: sum(cuotas.filter(q => q.est !== 'pagada' && q.fecha <= hoy), q => q.valor - q.abonado),
    vencidas: cuotas.filter(q => q.est === 'vencida').length,
    ganCobrada: c.total ? Math.min(pagado, c.total) * c.interes / c.total : 0,
    capCobrado: c.total ? Math.min(pagado, c.total) * c.capital / c.total : 0,
    progreso: c.total ? Math.min(1, pagado / c.total) : 0,
    ultimoPago: pagos.map(x => x.fecha).sort().pop() || null,
  };
}
function recompute() {
  PAGOS_BY = new Map(); for (const x of S.pagos) { if (!PAGOS_BY.has(x.prestamo_id)) PAGOS_BY.set(x.prestamo_id, []); PAGOS_BY.get(x.prestamo_id).push(x); }
  PBC = new Map(); for (const p of S.prestamos) { if (!PBC.has(p.cliente_id)) PBC.set(p.cliente_id, []); PBC.get(p.cliente_id).push(p); }
  CLI = new Map(S.clientes.map(c => [c.id, c]));
  PREST = new Map(S.prestamos.map(p => [p.id, p]));
  E = new Map(S.prestamos.map(p => [p.id, estado(p)]));
}
function resumenCliente(c) {
  const ps = PBC.get(c.id) || [], es = ps.map(p => E.get(p.id)), act = es.filter(e => e.activo);
  const sem = act.length ? act.reduce((w, e) => SEM_ORD[e.sem] > SEM_ORD[w] ? e.sem : w, 'verde') : ps.length ? 'azul' : 'gris';
  return {
    ...c, prestamos: ps.length, activos: act.length, sem,
    deuda: sum(act, e => e.saldo), debeHoy: sum(act, e => e.debeHoy), dias: act.length ? Math.max(...act.map(e => e.dias)) : 0,
    cuotasN: sum(act, e => e.n), cuotasPag: sum(act, e => e.pagadas), faltan: sum(act, e => e.faltan),
    proxima: act.map(e => e.proxima && e.proxima.fecha).filter(Boolean).sort()[0] || null,
    totalPrestado: sum(ps, p => p.capital), totalPagado: sum(es, e => e.pagado),
  };
}
function totales() {
  const es = [...E.values()];
  const aportes = sum(S.caja.filter(x => x.tipo === 'aporte'), x => x.valor), retiros = sum(S.caja.filter(x => x.tipo === 'retiro'), x => x.valor);
  const prestado = sum(S.prestamos, p => p.capital), cobrado = sum(S.pagos, x => x.valor);
  const disponible = aportes - retiros - prestado + cobrado;
  const porCobrar = sum(es, e => e.saldo);
  return {
    aportes, retiros, prestado, cobrado, disponible, porCobrar, total: disponible + porCobrar,
    capitalCalle: sum(es.filter(e => e.activo), e => e.capital - e.capCobrado),
    ganCobrada: sum(es, e => e.ganCobrada), ganPorCobrar: sum(es, e => e.interes - e.ganCobrada),
  };
}
function movimientos() {
  const m = [];
  for (const x of S.caja) m.push({ tipo: x.tipo, fecha: x.fecha, valor: +x.valor, nota: x.nota, creado: x.creado, id: x.id });
  for (const p of S.prestamos) m.push({ tipo: 'prestamo', fecha: p.fecha_inicio, valor: +p.capital, cliente_id: p.cliente_id, prestamo_id: p.id, creado: p.creado });
  for (const x of S.pagos) { const p = PREST.get(x.prestamo_id); if (p) m.push({ tipo: 'pago', fecha: x.fecha, valor: +x.valor, cliente_id: p.cliente_id, prestamo_id: p.id, nota: x.nota, creado: x.creado }); }
  return m.sort((a, b) => b.fecha.localeCompare(a.fecha) || String(b.creado || '').localeCompare(String(a.creado || '')));
}

/* ============================ Datos ============================ */
const TABLAS = ['clientes', 'prestamos', 'pagos', 'caja'];
let sb = null;
function guardarDemo() { if (DEMO) lsSet('cartera.prueba', JSON.stringify({ clientes: S.clientes, prestamos: S.prestamos, pagos: S.pagos, caja: S.caja, aj: S.aj })); }
function cargarDemo() { try { const d = JSON.parse(lsGet('cartera.prueba') || 'null'); if (d) { TABLAS.forEach(t => S[t] = d[t] || []); S.aj = { ...AJ_DEF, ...(d.aj || {}) }; } } catch {} }
async function fetchAll(t) {
  let out = [], from = 0; const step = 1000;
  for (;;) { const { data, error } = await sb.from(t).select('*').range(from, from + step - 1); if (error) throw error; out = out.concat(data); if (data.length < step) break; from += step; }
  return out;
}
const DB = {
  async loadAll() {
    if (DEMO) return;
    const [c, p, g, k, a] = await Promise.all([...TABLAS.map(fetchAll), sb.from('ajustes').select('*')]);
    S.clientes = c; S.prestamos = p; S.pagos = g; S.caja = k;
    S.aj = { ...AJ_DEF }; for (const r of (a.data || [])) if (r.clave in AJ_DEF) S.aj[r.clave] = +r.valor;
  },
  async insert(t, row) {
    if (DEMO) { const r = { id: uid(), creado: new Date().toISOString(), ...row }; S[t].push(r); guardarDemo(); return r; }
    const { data, error } = await sb.from(t).insert(row).select().single(); if (error) throw error; S[t].push(data); return data;
  },
  async update(t, id, patch) {
    if (DEMO) { Object.assign(S[t].find(x => x.id === id), patch); guardarDemo(); return; }
    const { data, error } = await sb.from(t).update(patch).eq('id', id).select().single(); if (error) throw error; S[t] = S[t].map(x => x.id === id ? data : x);
  },
  async remove(t, id) {
    if (!DEMO) { const { data, error } = await sb.from(t).delete().eq('id', id).select('id'); if (error) throw error; if (!data || !data.length) throw new Error('Solo el administrador puede borrar registros.'); }
    S[t] = S[t].filter(x => x.id !== id);
    if (t === 'prestamos') S.pagos = S.pagos.filter(x => x.prestamo_id !== id);
    guardarDemo();
  },
  async ajustes(obj) {
    if (!DEMO) { const { error } = await sb.from('ajustes').upsert(Object.entries(obj).map(([clave, valor]) => ({ clave, valor: String(valor) }))); if (error) throw error; }
    Object.assign(S.aj, obj); guardarDemo();
  },
};
function errMsg(e) {
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/invalid login/i.test(m)) return 'Correo o contraseña incorrectos.';
  if (/row-level security|permission denied/i.test(m)) return 'No tienes permiso para esta acción.';
  if (/foreign key/i.test(m)) return 'No se puede borrar: tiene préstamos registrados.';
  if (/failed to fetch|network/i.test(m)) return 'Sin conexión. Revisa tu internet.';
  return m;
}

/* ============================ Componentes ============================ */
const dot = s => `<span class="dot ${s}" title="${SEM_LBL[s]}"></span>`;
const pill = (s, t) => `<span class="pill ${s}">${t || SEM_LBL[s]}</span>`;
const empty = t => `<div class="empty">${t}</div>`;
const head = (title, sub, actions = '') => `<header class="top"><div><h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div><div class="top-act">${actions}</div></header>`;
const fld = (label, inner, cls = '') => `<label class="fld ${cls}"><span>${label}</span>${inner}</label>`;
const isAdmin = () => S.user && S.user.rol === 'admin';
function estadoTxt(e) {
  if (e.sem === 'azul') return '<span class="t-azul">Pagado</span>';
  if (e.dias) return `<span class="t-${e.sem}">${plural(e.dias, 'día', 'días')} sin pagar</span>`;
  if (e.debeHoy) return '<span class="t-amarillo">Paga hoy</span>';
  return e.proxima ? `<span class="t-verde">Próx. ${fCorta(e.proxima.fecha)}</span>` : '';
}
function waLink(c, monto) {
  const tel = String(c.telefono || '').replace(/\D/g, ''); if (!tel) return '';
  const txt = monto ? `Hola ${c.nombre.split(' ')[0]}, te recuerdo tu pago de ${fmt(monto)}. ¡Gracias!` : `Hola ${c.nombre.split(' ')[0]}, `;
  return `https://wa.me/${tel.length === 10 ? CONFIG.INDICATIVO_PAIS + tel : tel}?text=${encodeURIComponent(txt)}`;
}
function filaCobro(p) {
  const e = E.get(p.id), c = CLI.get(p.cliente_id) || {}, wa = waLink(c, e.debeHoy);
  return `<div class="row">${dot(e.sem)}
    <a class="grow" href="#/cliente/${c.id}"><b>${esc(c.nombre)}</b><small>Cuota ${e.proxima ? e.proxima.numero : ''} de ${e.n} · ${e.dias ? plural(e.dias, 'día', 'días') + ' sin pagar' : 'vence hoy'}</small></a>
    <div class="right"><div class="amt">${money(e.debeHoy)}</div></div>
    ${wa ? `<a class="icon-btn wa" href="${wa}" target="_blank" rel="noopener" title="Recordar por WhatsApp">${I.msg}</a>` : ''}
    <button class="btn sm primary" data-act="pagar" data-id="${p.id}">Cobrar</button></div>`;
}
function filaProx(p) {
  const e = E.get(p.id), c = CLI.get(p.cliente_id) || {};
  return `<a class="row" href="#/cliente/${c.id}">${dot(e.sem)}<div class="grow"><b>${esc(c.nombre)}</b><small>Cuota ${e.proxima.numero} de ${e.n} · ${fFecha(e.proxima.fecha)}</small></div><div class="amt">${money(e.proxima.valor - e.proxima.abonado)}</div></a>`;
}
function filaCliente(c) {
  const sub = c.activos ? `${plural(c.activos, 'préstamo', 'préstamos')} · lleva ${c.cuotasPag} de ${c.cuotasN} cuotas` : c.prestamos ? 'Todo pagado' : 'Sin préstamos';
  const der = c.sem === 'rojo' || c.sem === 'amarillo' ? `<span class="t-${c.sem}">${plural(c.dias, 'día', 'días')} sin pagar</span>` : c.sem === 'verde' ? (c.debeHoy ? '<span class="t-amarillo">Paga hoy</span>' : `<span class="t-verde">Próx. ${fCorta(c.proxima)}</span>`) : `<span class="t-${c.sem}">${SEM_LBL[c.sem]}</span>`;
  return `<a class="row" href="#/cliente/${c.id}">${dot(c.sem)}<div class="grow"><b>${esc(c.nombre)}</b><small>${sub}</small></div>
    <div class="right"><div class="amt">${c.activos ? money(c.deuda) : '—'}</div><small>${der}</small></div></a>`;
}
function tarjetaPrestamo(p) {
  const e = E.get(p.id);
  return `<section class="card loan">
    <div class="loan-top"><div><b>${dot(e.sem)} Préstamo de ${money(e.capital)}</b>
      <small>${fFecha(p.fecha_inicio)} · ${+p.tasa}% mensual · ${nMeses(p.meses)} · pago ${frecuenciaTxt(p.meses, p.num_cuotas)}</small></div>
      ${pill(e.sem, e.sem === 'rojo' || e.sem === 'amarillo' ? `${SEM_LBL[e.sem]} · ${e.dias} d` : null)}</div>
    <div class="qs">${e.cuotas.map(q => `<span class="q ${q.est}" title="Cuota ${q.numero} · ${fFecha(q.fecha)} · ${fmt(q.valor)}">${q.numero}</span>`).join('')}</div>
    <div class="stats">
      <div><small>Cuota</small><b>${money(e.cuota)}</b></div>
      <div><small>Lleva</small><b>${e.pagadas} de ${e.n}</b></div>
      <div><small>Faltan</small><b>${plural(e.faltan, 'cuota', 'cuotas')}</b></div>
      <div><small>Debe</small><b class="${e.sem === 'rojo' ? 't-rojo' : ''}">${money(e.saldo)}</b></div>
      <div><small>${e.activo ? 'Próximo pago' : 'Total pagado'}</small><b>${e.activo ? fCorta(e.proxima.fecha) : money(e.pagado)}</b></div>
    </div>
    <div class="actions-inline">${e.activo ? `<button class="btn sm primary" data-act="pagar" data-id="${p.id}">${I.cobrar}Registrar pago</button>` : ''}<a class="btn sm" href="#/prestamo/${p.id}">Ver detalle</a></div>
  </section>`;
}

/* ============================ Vistas ============================ */
function vInicio() {
  const T = totales(), hoy = hoyStr(), en7 = toStr(addDays(new Date(), 7));
  const act = S.prestamos.filter(p => E.get(p.id).activo);
  const cobros = act.filter(p => E.get(p.id).debeHoy > 0).sort((a, b) => E.get(b.id).dias - E.get(a.id).dias);
  const prox = act.filter(p => { const e = E.get(p.id); return !e.debeHoy && e.proxima && e.proxima.fecha > hoy && e.proxima.fecha <= en7; }).sort((a, b) => E.get(a.id).proxima.fecha.localeCompare(E.get(b.id).proxima.fecha));
  const mes = hoy.slice(0, 7), cobradoMes = sum(S.pagos.filter(x => String(x.fecha).slice(0, 7) === mes), x => x.valor);
  const rc = S.clientes.map(resumenCliente).filter(c => c.activos);
  const tile = (s, label, sub) => { const g = rc.filter(c => c.sem === s); return `<button class="semt ${s}" data-act="ver-sem" data-v="${s}"><span class="t">${dot(s)}${label}</span><div class="n">${g.length}</div><div class="s">${sub} · ${money(sum(g, c => c.deuda))}</div></button>`; };
  const fecha = new Date().toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
  const vacio = !S.prestamos.length;
  return head('Inicio', fecha.charAt(0).toUpperCase() + fecha.slice(1),
    `${act.length ? `<button class="btn" data-act="pago-rapido">${I.cobrar}<span class="lbl">Registrar pago</span></button>` : ''}<button class="btn primary" data-act="nuevo-prestamo">${I.plus}<span class="lbl">Nuevo préstamo</span></button>`) +
  `<div class="hero">
    <div class="caja"><small>Dinero disponible para prestar</small><div class="big">${T.disponible < 0 ? '−' : ''}${money(Math.abs(T.disponible))}</div>
      <div class="btns"><button class="btn" data-act="aporte">${I.plus}Agregar dinero</button><button class="btn" data-act="retiro">Sacar dinero</button></div></div>
    <div class="kpis">
      <div class="kpi"><small>Dinero en la calle (por cobrar)</small><b>${money(T.porCobrar)}</b><em>${plural(act.length, 'préstamo activo', 'préstamos activos')}</em></div>
      <div class="kpi"><small>Total del negocio</small><b>${money(T.total)}</b><em>Disponible + por cobrar</em></div>
      <div class="kpi"><small>Ganancia cobrada</small><b class="t-verde">${money(T.ganCobrada)}</b><em>Falta por cobrar ${money(T.ganPorCobrar)}</em></div>
      <div class="kpi"><small>Cobrado este mes</small><b>${money(cobradoMes)}</b><em>${plural(S.pagos.filter(x => String(x.fecha).slice(0, 7) === mes).length, 'pago', 'pagos')}</em></div>
    </div></div>` +
  (vacio ? `<section class="card welcome"><h3>Empecemos</h3><p class="muted" style="margin:0">La app está vacía. Tres pasos y ya queda andando:</p>
      <div class="steps">
        <div class="step"><span class="n">1</span><b>Dinero para prestar</b><p>Registra cuánto dinero tienes disponible.</p><button class="btn sm" data-act="aporte">Agregar dinero</button></div>
        <div class="step"><span class="n">2</span><b>Primer préstamo</b><p>Cliente, monto, interés, meses y cuotas. La app calcula todo.</p><button class="btn sm primary" data-act="nuevo-prestamo">Nuevo préstamo</button></div>
        <div class="step"><span class="n">3</span><b>Pagos</b><p>Cada vez que te paguen, toca “Cobrar”. Las cuentas se actualizan solas.</p></div>
      </div></section>` :
  `<div class="sem">${tile('verde', 'Al día', 'Deben')}${tile('amarillo', 'Atrasados', `1 a ${S.aj.dias_mora - 1} días`)}${tile('rojo', 'En mora', `${S.aj.dias_mora}+ días`)}</div>
   <div class="cols">
     <section class="card list"><div class="sec-h"><h3>Para cobrar hoy</h3><span class="muted" style="font-size:13px">${money(sum(cobros, p => E.get(p.id).debeHoy))}</span></div>
       ${cobros.map(filaCobro).join('') || empty('Nadie debe nada hoy.')}</section>
     <section class="card list"><div class="sec-h"><h3>Próximos 7 días</h3></div>
       ${prox.map(filaProx).join('') || empty('No hay cuotas en los próximos 7 días.')}</section>
   </div>`);
}

function vClientes() {
  const f = S.f, all = S.clientes.map(resumenCliente); let list = all;
  const q = f.q.trim().toLowerCase();
  if (q) list = list.filter(c => [c.nombre, c.telefono, c.documento].some(v => String(v || '').toLowerCase().includes(q)));
  if (f.sem !== 'todos') list = list.filter(c => c.sem === f.sem);
  list.sort((a, b) => SEM_ORD[b.sem] - SEM_ORD[a.sem] || b.dias - a.dias || a.nombre.localeCompare(b.nombre));
  const n = s => all.filter(c => c.sem === s).length;
  const ch = [['todos', 'Todos', all.length], ['verde', 'Al día', n('verde'), 'verde'], ['amarillo', 'Atrasados', n('amarillo'), 'amarillo'], ['rojo', 'En mora', n('rojo'), 'rojo'], ['azul', 'Pagados', n('azul'), 'azul']];
  return head('Clientes', `${plural(all.length, 'cliente', 'clientes')} · deben ${money(sum(all, c => c.deuda))}`, `<button class="btn primary" data-act="nuevo-cliente">${I.plus}<span class="lbl">Nuevo cliente</span></button>`) +
    `<div class="toolbar"><label class="search">${I.buscar}<input id="q-cli" placeholder="Buscar cliente" value="${esc(f.q)}" data-input="q" autocomplete="off"></label>
     <div class="chips">${ch.map(([v, l, k, s]) => `<button class="chip ${f.sem === v ? 'on' : ''}" data-act="filtro" data-v="${v}">${s ? dot(s) : ''}${l} <i>${k}</i></button>`).join('')}</div></div>
    <section class="card list">${list.map(filaCliente).join('') || empty(all.length ? 'Ningún cliente con ese filtro.' : 'Aún no hay clientes. Se crean solos al registrar un préstamo.')}</section>`;
}

function vCliente(id) {
  const base = CLI.get(id); if (!base) return noEnc('#/clientes', 'Clientes');
  const c = resumenCliente(base), wa = waLink(c, c.debeHoy);
  const ps = (PBC.get(id) || []).slice().sort((a, b) => (E.get(b.id).activo - E.get(a.id).activo) || b.fecha_inicio.localeCompare(a.fecha_inicio));
  return `<a class="back" href="#/clientes">${I.atras}Clientes</a>` +
    head(`${dot(c.sem)}${esc(c.nombre)}`, `${pill(c.sem)}${c.telefono ? ` &nbsp;${esc(c.telefono)}` : ''}${c.notas ? ` · ${esc(c.notas)}` : ''}`,
      `${wa ? `<a class="btn" href="${wa}" target="_blank" rel="noopener">${I.msg}<span class="lbl">WhatsApp</span></a>` : ''}
       <button class="btn" data-act="editar-cliente" data-id="${id}">${I.editar}<span class="lbl">Editar</span></button>
       ${isAdmin() && !c.prestamos ? `<button class="btn" data-act="borrar-cliente" data-id="${id}">${I.basura}</button>` : ''}
       <button class="btn primary" data-act="nuevo-prestamo" data-cliente="${id}">${I.plus}<span class="lbl">Nuevo préstamo</span></button>`) +
    `<div class="kpis">
      <div class="kpi"><small>Debe en total</small><b>${money(c.deuda)}</b><em>${plural(c.activos, 'préstamo activo', 'préstamos activos')}</em></div>
      <div class="kpi"><small>Cuotas</small><b>${c.cuotasPag} de ${c.cuotasN}</b><em>Faltan ${c.faltan}</em></div>
      <div class="kpi"><small>Le has prestado</small><b>${money(c.totalPrestado)}</b><em>${plural(c.prestamos, 'préstamo', 'préstamos')} en total</em></div>
      <div class="kpi"><small>Te ha pagado</small><b class="t-verde">${money(c.totalPagado)}</b><em>Próximo pago ${fCorta(c.proxima)}</em></div></div>
    ${ps.map(tarjetaPrestamo).join('') || `<section class="card">${empty('Este cliente no tiene préstamos.')}</section>`}`;
}

function vPrestamo(id) {
  const p = PREST.get(id); if (!p) return noEnc('#/clientes', 'Clientes');
  const e = E.get(id), c = CLI.get(p.cliente_id) || {};
  const pags = (PAGOS_BY.get(id) || []).slice().sort((a, b) => b.fecha.localeCompare(a.fecha) || String(b.creado || '').localeCompare(String(a.creado || '')));
  const EST = { pagada: 'Pagada', vencida: 'Vencida', hoy: 'Hoy', parcial: 'Abono', pendiente: 'Pendiente' };
  return `<a class="back" href="#/cliente/${c.id}">${I.atras}${esc(c.nombre || 'Cliente')}</a>` +
    head(`${dot(e.sem)}Préstamo de ${money(p.capital)}`, `${esc(c.nombre)} · ${fFecha(p.fecha_inicio)} · ${+p.tasa}% mensual · ${nMeses(p.meses)} · ${p.num_cuotas} cuotas (${frecuenciaTxt(p.meses, p.num_cuotas)})`,
      `${e.activo ? `<button class="btn primary" data-act="pagar" data-id="${id}">${I.cobrar}<span class="lbl">Registrar pago</span></button>` : ''}${isAdmin() ? `<button class="btn" data-act="borrar-prestamo" data-id="${id}" title="Borrar préstamo">${I.basura}</button>` : ''}`) +
    `<div class="kpis">
      <div class="kpi"><small>Prestado</small><b>${money(e.capital)}</b><em>Ganancia ${money(e.interes)}</em></div>
      <div class="kpi"><small>Total a pagar</small><b>${money(e.total)}</b><em>${e.n} × ${money(e.cuota)}</em></div>
      <div class="kpi"><small>Ha pagado</small><b class="t-verde">${money(e.pagado)}</b><em>${e.pagadas} de ${e.n} cuotas</em></div>
      <div class="kpi"><small>Debe</small><b>${money(e.saldo)}</b><em>${estadoTxt(e)}</em></div></div>
    <div class="cols">
      <section class="card"><div class="sec-h"><h3>Cuotas</h3><span class="muted" style="font-size:13px">Faltan ${e.faltan}</span></div>
        <div class="tbl-wrap"><table><thead><tr><th>#</th><th>Fecha</th><th class="r">Valor</th><th class="r">Pagado</th><th>Estado</th></tr></thead><tbody>
        ${e.cuotas.map(q => `<tr class="${q.est === 'hoy' ? 'is-hoy' : ''}"><td>${q.numero}</td><td>${fFecha(q.fecha)}</td><td class="r">${money(q.valor)}</td><td class="r">${q.abonado ? money(q.abonado) : '—'}</td><td>${pill(q.est, EST[q.est])}</td></tr>`).join('')}
        </tbody></table></div></section>
      <section class="card list"><div class="sec-h"><h3>Pagos recibidos</h3></div>
        ${pags.map(x => `<div class="row"><span class="mv in">↓</span><div class="grow"><b>${money(x.valor)}</b><small>${fFecha(x.fecha)}${x.nota ? ' · ' + esc(x.nota) : ''}</small></div>${isAdmin() ? `<button class="icon-btn" data-act="borrar-pago" data-id="${x.id}" title="Borrar pago">${I.basura}</button>` : ''}</div>`).join('') || empty('Todavía no hay pagos.')}
      </section></div>`;
}

function vCaja() {
  const T = totales(), f = S.f, h = hoyStr(), d = new Date();
  const per = { mes: [h.slice(0, 8) + '01', h], ant: [toStr(new Date(d.getFullYear(), d.getMonth() - 1, 1)), toStr(new Date(d.getFullYear(), d.getMonth(), 0))], todo: ['', ''] }[f.periodo];
  let m = movimientos(); if (per[0]) m = m.filter(x => x.fecha >= per[0] && x.fecha <= per[1]);
  const LBL = { aporte: 'Dinero agregado', retiro: 'Dinero retirado', prestamo: 'Préstamo entregado', pago: 'Pago recibido' };
  const entra = x => x.tipo === 'aporte' || x.tipo === 'pago';
  let html = '', last = '';
  for (const x of m.slice(0, 500)) {
    if (x.fecha !== last) { last = x.fecha; html += `<div class="day-h">${fFecha(x.fecha)}</div>`; }
    const c = x.cliente_id ? CLI.get(x.cliente_id) || {} : null;
    const inner = `<span class="mv ${entra(x) ? 'in' : 'out'}">${entra(x) ? '↓' : '↑'}</span><div class="grow"><b>${c ? esc(c.nombre) : LBL[x.tipo]}</b><small>${c ? LBL[x.tipo] : 'Caja'}${x.nota ? ' · ' + esc(x.nota) : ''}</small></div><div class="amt ${entra(x) ? 'pos' : ''}">${entra(x) ? '+' : '−'}${money(x.valor)}</div>`;
    html += x.prestamo_id ? `<a class="row" href="#/prestamo/${x.prestamo_id}">${inner}</a>` : `<div class="row">${inner}${isAdmin() ? `<button class="icon-btn" data-act="borrar-caja" data-id="${x.id}" title="Borrar">${I.basura}</button>` : ''}</div>`;
  }
  const s = t => sum(m.filter(x => x.tipo === t), x => x.valor);
  return head('Caja', 'El dinero que entra y sale', `<button class="btn" data-act="csv">${I.descargar}<span class="lbl">Exportar a Excel</span></button>`) +
    `<div class="hero"><div class="caja"><small>Dinero disponible para prestar</small><div class="big">${T.disponible < 0 ? '−' : ''}${money(Math.abs(T.disponible))}</div>
      <div class="btns"><button class="btn" data-act="aporte">${I.plus}Agregar dinero</button><button class="btn" data-act="retiro">Sacar dinero</button></div></div>
      <div class="kpis">
        <div class="kpi"><small>Cobrado ${f.periodo === 'todo' ? '' : 'en el periodo'}</small><b class="t-verde">${money(s('pago'))}</b><em>Pagos de clientes</em></div>
        <div class="kpi"><small>Prestado ${f.periodo === 'todo' ? '' : 'en el periodo'}</small><b>${money(s('prestamo'))}</b><em>Dinero entregado</em></div>
        <div class="kpi"><small>Dinero agregado</small><b>${money(s('aporte'))}</b><em>Retirado ${money(s('retiro'))}</em></div>
        <div class="kpi"><small>Total del negocio</small><b>${money(T.total)}</b><em>Disponible + por cobrar</em></div></div></div>
    <div class="toolbar"><div class="chips">${[['mes', 'Este mes'], ['ant', 'Mes anterior'], ['todo', 'Todo']].map(([v, l]) => `<button class="chip ${f.periodo === v ? 'on' : ''}" data-act="periodo" data-v="${v}">${l}</button>`).join('')}</div></div>
    <section class="card list">${html || empty('No hay movimientos en este periodo.')}</section>`;
}
const noEnc = (href, txt) => `<a class="back" href="${href}">${I.atras}${txt}</a>` + empty('No se encontró (pudo ser borrado).');

/* ============================ Shell y ruteo ============================ */
const app = $('#app');
function vShell() {
  const nav = [['inicio', 'Inicio', I.panel], ['clientes', 'Clientes', I.clientes], ['caja', 'Caja', I.caja]];
  const brand = `<div class="brand"><span class="logo img">${I.cobrar}</span><div><b>${esc(CONFIG.NOMBRE_NEGOCIO)}</b><small>${esc(CONFIG.LEMA)}</small></div></div>`;
  const tools = `<button class="icon-btn" data-act="privado" title="Ocultar / mostrar montos">${document.body.classList.contains('privado') ? I.ojoNo : I.ojo}</button><button class="icon-btn" data-act="ajustes" title="Ajustes">${I.ajustes}</button><button class="icon-btn" data-act="salir" title="Cerrar sesión">${I.salir}</button>`;
  app.innerHTML = `${DEMO ? '<div class="demo-bar">Modo de prueba · los datos se guardan solo en este navegador. Conecta Supabase para usarla de verdad.</div>' : ''}
  <div class="shell">
    <aside class="side">${brand}<nav class="nav">${nav.map(([r, l, i]) => `<a href="#/${r}" data-r="${r}">${i}${l}</a>`).join('')}</nav>
      <div style="padding:14px 4px 0"><button class="btn primary block" data-act="nuevo-prestamo">${I.plus}Nuevo préstamo</button></div><div class="grow"></div>
      <div class="userbox"><div class="who"><b>${esc(S.user.nombre || S.user.email)}</b><small>${S.user.rol === 'admin' ? 'Administrador' : 'Operador'}</small></div>${tools}</div></aside>
    <div style="min-width:0"><div class="mtop">${brand}${tools}</div><main class="main" id="main"></main></div>
  </div>
  <nav class="bnav"><a href="#/inicio" data-r="inicio">${I.panel}Inicio</a><a href="#/clientes" data-r="clientes">${I.clientes}Clientes</a>
    <button data-act="rapido" aria-label="Nuevo"><span class="plus">${I.plus}</span></button>
    <a href="#/caja" data-r="caja">${I.caja}Caja</a><button data-act="ajustes">${I.ajustes}Ajustes</button></nav>
  <div id="modal-root"></div><div id="toasts"></div>`;
}
function render() {
  if (!S.user || !$('#main')) return;
  const [v, id] = (location.hash.replace(/^#\/?/, '') || 'inicio').split('/');
  const sec = { cliente: 'clientes', prestamo: 'clientes' }[v] || v;
  document.querySelectorAll('[data-r]').forEach(a => a.classList.toggle('on', a.dataset.r === sec));
  const fid = document.activeElement && document.activeElement.id;
  const V = { inicio: vInicio, clientes: vClientes, cliente: () => vCliente(id), prestamo: () => vPrestamo(id), caja: vCaja };
  $('#main').innerHTML = (V[v] || vInicio)();
  if (fid) { const el = document.getElementById(fid); if (el && el.closest('#main')) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch {} } }
}
let lastRoute = '';
window.addEventListener('hashchange', () => { render(); if (location.hash !== lastRoute) { lastRoute = location.hash; window.scrollTo(0, 0); } });
const after = () => { recompute(); render(); };
const ir = h => { recompute(); if (location.hash === h) render(); else location.hash = h; };

/* ============================ Modales ============================ */
let onModalClose = null;
function cerrarModal() { const r = $('#modal-root'); if (r) r.innerHTML = ''; const cb = onModalClose; onModalClose = null; if (cb) cb(); }
function modal(title, body, { onSubmit, submitText = 'Guardar', danger = false, onClose = null, footer = true } = {}) {
  cerrarModal(); onModalClose = onClose;
  const root = $('#modal-root');
  root.innerHTML = `<div class="ov"><form class="dlg" id="dlg" autocomplete="off">

    <label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn primary block" type="submit" style="height:44px">Entrar</button>
    ${DEMO ? '' : '<button type="button" class="link" id="olvido">¿Olvidaste tu contraseña?</button>'}

  const f = $('#f-login');
  f.addEventListener('submit', async ev => {
    ev.preventDefault(); const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Entrando…';
    try {
      if (DEMO) { await entrar({ email: f.email.value }); return; }
      const { data, error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value });
      if (error) throw error; await entrar(data.user);
    } catch (e) { vLogin(errMsg(e)); }
  });
  const o = $('#olvido');
  if (o) o.addEventListener('click', async () => {
    const email = f.email.value.trim(); if (!email) { vLogin('Escribe tu correo y vuelve a tocar “¿Olvidaste tu contraseña?”.'); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    vLogin(error ? errMsg(error) : 'Si el correo está autorizado, te llegará un enlace para crear tu contraseña.', !error);
  });
}

async function entrar(user) {
  if (DEMO) { S.user = { email: user.email || 'prueba@correo.com', nombre: 'Modo de prueba', rol: 'admin' }; cargarDemo(); }
  else {
    app.innerHTML = '<div class="loading"><div class="spin"></div></div>';
    const [aut] = await Promise.all([sb.from('usuarios_autorizados').select('email,nombre,rol').maybeSingle(), DB.loadAll().catch(e => console.error(e))]);
    if (aut.error) { console.error(aut.error); await sb.auth.signOut(); TABLAS.forEach(t => S[t] = []); vLogin('Error de permisos en la base de datos (' + (aut.error.code || '') + '): ' + aut.error.message); return; }
    if (!aut.data) { await sb.auth.signOut(); TABLAS.forEach(t => S[t] = []); vLogin('El correo ' + ((user && user.email) || '') + ' no está en la lista de autorizados.'); return; }
    S.user = { email: aut.data.email, nombre: aut.data.nombre, rol: aut.data.rol };
    suscribir();
  }
  if (!/^#\/[a-z]/.test(location.hash) || /access_token|type=/.test(location.hash)) history.replaceState(null, '', location.pathname + '#/inicio');
  lastRoute = location.hash; recompute(); vShell(); render(); ultimaActividad = Date.now();
}
async function salir(msg) {
  if (!DEMO && sb) { try { if (canal) await sb.removeChannel(canal); } catch {} canal = null; await sb.auth.signOut(); TABLAS.forEach(t => S[t] = []); }
  vLogin(msg || '');
}
let canal = null;
function suscribir() {
  if (DEMO || canal) return;
  let t; const recargar = () => { clearTimeout(t); t = setTimeout(async () => { try { await DB.loadAll(); after(); } catch (e) { console.error(e); } }, 350); };
  canal = sb.channel('cartera');
  [...TABLAS, 'ajustes'].forEach(tb => canal.on('postgres_changes', { event: '*', schema: 'public', table: tb }, recargar));
  canal.subscribe();
}
let ultimaActividad = Date.now();
['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(ev => addEventListener(ev, () => { ultimaActividad = Date.now(); }, { passive: true }));
function revisarInactividad() { if (!DEMO && S.user && CONFIG.INACTIVIDAD_MIN > 0 && Date.now() - ultimaActividad > CONFIG.INACTIVIDAD_MIN * 60000) salir('Sesión cerrada por inactividad.'); }
setInterval(revisarInactividad, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) revisarInactividad(); });
let diaActual = hoyStr();
setInterval(() => { if (hoyStr() !== diaActual) { diaActual = hoyStr(); if (S.user) after(); } }, 60000);

function cargarScript(src) { return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('No se pudo cargar la conexión')); document.head.append(s); }); }
async function boot() {
  const tema = lsGet('cartera.tema'); if (tema) document.documentElement.dataset.theme = tema;
  if (lsGet('cartera.privado')) document.body.classList.add('privado');
  if (DEMO) { vLogin(); return; }
  const l = document.createElement('link'); l.rel = 'preconnect'; l.href = CONFIG.SUPABASE_URL; document.head.append(l);
  app.innerHTML = '<div class="loading"><div class="spin"></div></div>';
  try { await cargarScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'); }
  catch (e) { app.innerHTML = `<div class="loading"><div class="alert">${esc(e.message)}. Revisa tu internet.</div></div>`; return; }
  sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  const recuperacion = /type=(recovery|invite)/.test(location.hash);
  sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') vNuevaClave(); });
  const { data: { session } } = await sb.auth.getSession();
  if (recuperacion && session) { vNuevaClave(); return; }
  if (session) await entrar(session.user); else vLogin();
}
boot();
</script>
